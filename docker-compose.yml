services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autoforge
      POSTGRES_PASSWORD: autoforge
      POSTGRES_DB: autoforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated PostgreSQL instance for preview databases
  postgres_preview:
    image: postgres:16
    environment:
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: preview_secret
      POSTGRES_DB: preview_template
    ports:
      - "5433:5432"
    volumes:
      - postgres_preview_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autoforge:autoforge@postgres:5432/autoforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PREVIEW_DB_HOST: postgres_preview
      PREVIEW_DB_PORT: 5432
      PREVIEW_DB_USER: preview
      PREVIEW_DB_PASSWORD: preview_secret
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    command: uvicorn autoforge.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://autoforge:autoforge@postgres:5432/autoforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A autoforge.tasks.celery_app worker --loglevel=info -c 2

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://autoforge:autoforge@postgres:5432/autoforge
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A autoforge.tasks.celery_app beat --loglevel=info

  portal:
    build:
      context: portal
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./portal/src:/app/src

volumes:
  postgres_data:
  postgres_preview_data:
  redis_data:
