[package]
name = "autoforge"
version = "0.1.0"
description = "AutoForge — Human-Lite-in-the-Loop software factory"
authors = []
edition = "2021"

[lib]
name = "autoforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
