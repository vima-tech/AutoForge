[package]
name = "autoforge"
version = "0.1.0"
description = "AutoForge — Human-Lite-in-the-Loop software factory"
authors = []
edition = "2021"

[lib]
name = "autoforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
# Innate 自成长知识层：以 in-process SDK 依赖嵌入（lib 名 innate_core）。
# 0.1.11 起 rusqlite 对齐 libsqlite3-sys 0.30，与 sqlx 共用一份 sqlite，无 links 冲突。
# 0.1.12 新增直觉层 appraise critic（纯增量，现有 recall/record/add API 不变）。
innate = "0.1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
reqwest = { version = "0.13", features = ["json", "multipart"] }
# 实时 ASR：后端 WebSocket 代理对接阿里 DashScope 流式识别（native-tls 复用系统 openssl）。
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# 会议录音内置解码（纯 Rust，零系统依赖）：浏览器 WebView 解不出某格式时后端兜底。
# 覆盖 mp3 / aac(m4a,isomp4) / wav(pcm) / flac / ogg(vorbis)；Opus 暂无成熟纯 Rust 解码器，仍走 WebView。
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis"] }
futures-util = "0.3"
axum = "0.8"
once_cell = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# 凭据静态加密：信封加密（主密钥进系统钥匙环，密钥密文落 SQLite）。
# keyring v3 须显式选后端；crypto-rust 用纯 Rust AES，避免引入 openssl 系统依赖。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
rand = "0.8"
# 物料库删除走系统回收站（freedesktop XDG Trash / macOS Trash / Windows 回收站），便于误删恢复。
trash = "5"
# 批量导入读取电子表格（xlsx/xls/ods，纯 Rust，只读）；模板导出写 xlsx（rust_xlsxwriter，纯 Rust）。
calamine = "0.26"
rust_xlsxwriter = "0.79"

# Linux/WebKitGTK：直接访问底层 webview 以放行 getUserMedia（麦克风/语音录入）。
# 版本与 wry 锁定的 webkit2gtk 一致（4.1 / soup3），避免 ABI 冲突。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_4"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
