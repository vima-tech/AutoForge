<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>反馈进度查询</title>
<style>
  /* 自包含的「熔炉/余烬」配色（外部托管页，无法引用应用 CSS 变量，故内联匹配色板）。 */
  :root {
    --bg: #16110d; --bg2: #211a13; --bg3: #2a2017;
    --text: #f3ece4; --text2: #b9afa3; --text3: #8c8276;
    --ember: #e8772e; --border: rgba(255,255,255,.08);
    --green: #4f9d6b; --amber: #e0a32e; --red: #c2571a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: min(520px, 100%); background: var(--bg2);
    border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    box-shadow: 0 18px 48px rgba(0,0,0,.4);
  }
  .kicker {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ember); margin-bottom: 6px;
  }
  h1 { font-size: 22px; margin: 0 0 18px; font-weight: 800; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; color: var(--text); font-size: 14px; font-family: ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px rgba(232,119,46,.18); }
  button {
    background: linear-gradient(135deg, #f4a93c, #e8772e, #d65f1c); color: #1a1208;
    border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: .6; cursor: default; }
  .result { margin-top: 22px; }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 99px; font-weight: 700; font-size: 14px;
    background: rgba(232,119,46,.16); color: var(--ember);
  }
  .badge.done { background: rgba(79,157,107,.18); color: var(--green); }
  .badge.rejected { background: rgba(194,87,26,.18); color: var(--red); }
  .title { margin: 14px 0 4px; font-size: 16px; font-weight: 600; }
  .meta { color: var(--text3); font-size: 12px; font-family: ui-monospace, monospace; }
  .empty { color: var(--text3); font-size: 14px; margin-top: 22px; }
  .hint { color: var(--text3); font-size: 12px; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">FEEDBACK · 进度回执</div>
    <h1>查询你的反馈进度</h1>
    <div class="row">
      <input id="id" placeholder="粘贴提交后获得的反馈编号…" autocomplete="off" />
      <button id="go">查询</button>
    </div>
    <div id="out"></div>
    <div class="hint">提交反馈后会返回一个反馈编号；凭它可随时回到本页查看处理进度。本页只读，不展示任何内部细节。</div>
  </div>
<script>
  var $id = document.getElementById('id');
  var $go = document.getElementById('go');
  var $out = document.getElementById('out');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function render(d){
    if (!d || !d.found){ $out.innerHTML = '<div class="empty">没有找到该反馈编号，请确认编号是否正确。</div>'; return; }
    var cls = d.status === '已完成' ? 'done' : (d.status === '经评估未采纳' ? 'rejected' : '');
    $out.innerHTML =
      '<div class="result">' +
        '<span class="badge ' + cls + '">' + esc(d.status) + '</span>' +
        '<div class="title">' + esc(d.title) + '</div>' +
        '<div class="meta">提交于 ' + esc(d.submitted_at) + ' · 更新于 ' + esc(d.updated_at) + '</div>' +
      '</div>';
  }

  function query(){
    var id = $id.value.trim();
    if (!id) return;
    $go.disabled = true; $out.innerHTML = '<div class="empty">查询中…</div>';
    fetch('/feedback/status?id=' + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(){ $out.innerHTML = '<div class="empty">查询失败，请稍后再试。</div>'; })
      .finally(function(){ $go.disabled = false; });
  }

  $go.addEventListener('click', query);
  $id.addEventListener('keydown', function(e){ if (e.key === 'Enter') query(); });

  // 支持 URL 直达：/feedback?id=xxx 自动查询。
  var pre = new URLSearchParams(location.search).get('id');
  if (pre){ $id.value = pre; query(); }
</script>
</body>
</html>
